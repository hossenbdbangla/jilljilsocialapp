<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jilljil Social App</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5fb;color:#20243a;font-family:system-ui,"Noto Sans Bengali",sans-serif}header{padding:22px;background:linear-gradient(120deg,#5c4ee5,#a14de0);color:white}header h1{margin:0}header p{margin:6px 0 0}main{max-width:950px;margin:18px auto;padding:0 12px;display:grid;grid-template-columns:300px 1fr;gap:14px}.card{background:white;border:1px solid #e3e7f1;border-radius:15px;padding:16px;margin-bottom:14px}h2{font-size:18px;margin:0 0 12px}input,textarea,button{font:inherit}input,textarea{width:100%;padding:11px;border:1px solid #d7dcec;border-radius:9px;margin:5px 0 10px}textarea{min-height:80px}button{border:0;border-radius:9px;padding:10px 12px;background:#6558e8;color:white;font-weight:650;cursor:pointer}.secondary{background:#eeedff;color:#4b40b9}.row{display:flex;gap:8px}.row button{flex:1}.muted{color:#687386;font-size:13px}.status{display:none;padding:10px;border-radius:9px;background:#eeedff;margin-bottom:10px;font-size:14px}.hidden{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.post,.product{border-top:1px solid #e5e8f0;padding:14px 0}.photo{width:100%;max-height:350px;object-fit:cover;border-radius:10px}.meta{font-size:12px;color:#687386}.price{color:#168052;font-size:18px;font-weight:800}@media(max-width:700px){main{grid-template-columns:1fr}header h1{font-size:23px}}
</style></head><body><header><h1>✨ Jilljil Social App</h1><p>পোস্ট করুন, মানুষের সঙ্গে যুক্ত হোন, পণ্য শেয়ার করুন</p></header><main><aside>
<div class="card"><h2>🔐 অ্যাকাউন্ট</h2><div id="status" class="status"></div><div id="authForm"><input id="email" type="email" placeholder="ইমেইল"><input id="password" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)"><div class="row"><button id="signup">অ্যাকাউন্ট তৈরি</button><button class="secondary" id="login">লগইন</button></div><p class="muted">ইমেইল নিশ্চিতকরণ চালু থাকলে ইনবক্স দেখুন।</p></div><div id="signed" class="hidden"><p id="who" class="muted"></p><button id="logout">লগআউট</button></div></div>
<div class="card"><h2>📝 নতুন পোস্ট</h2><textarea id="content" placeholder="আপনার কথা লিখুন..."></textarea><input id="postImage" placeholder="ছবির URL (ঐচ্ছিক)"><button id="publish" style="width:100%">পোস্ট প্রকাশ</button></div>
<div class="card"><h2>🛍️ পণ্য যোগ করুন</h2><input id="pname" placeholder="পণ্যের নাম"><textarea id="desc" placeholder="পণ্যের বিবরণ"></textarea><input id="price" type="number" min="0" placeholder="দাম (৳)"><input id="pimage" placeholder="ছবির URL (ঐচ্ছিক)"><button id="addProduct" style="width:100%">পণ্য যোগ করুন</button></div>
</aside><section><div class="tabs"><button id="postsTab">📰 পোস্ট</button><button class="secondary" id="productsTab">🛒 পণ্য</button></div><div id="feed" class="card"><h2>সাম্প্রতিক পোস্ট</h2>লোড হচ্ছে...</div></section></main>
<script>
/* এখানে YOUR_SUPABASE_PUBLISHABLE_KEY-এর জায়গায় আপনার sb_publishable_ key বসান। Secret/service_role key ব্যবহার করবেন না। */
const URL="https://qshywfhpvsqctkhbxdt.supabase.co";
const KEY="sb_publishable_Z0PeDyvWIFO2tf5GouM_mA_mX7xere_";
const db=window.supabase.createClient(URL,KEY);let user=null;
const $=id=>document.getElementById(id);
function msg(t,bad=false){$("status").textContent=t;$("status").style.display="block";$("status").style.background=bad?"#fff0f0":"#eeedff"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function url(s){try{let u=new URL(s);return ["http:","https:"].includes(u.protocol)?u.href:""}catch{return ""}}
function authUI(u){user=u;$("authForm").classList.toggle("hidden",!!u);$("signed").classList.toggle("hidden",!u);$("who").textContent=u?"লগইন: "+u.email:""}
$("signup").onclick=async()=>{let email=$("email").value.trim(),password=$("password").value;if(!email||password.length<6)return msg("সঠিক ইমেইল ও কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।",true);let {error}=await db.auth.signUp({email,password});error?msg(error.message,true):msg("অ্যাকাউন্ট তৈরির অনুরোধ হয়েছে। ইমেইল নিশ্চিত করতে ইনবক্স দেখুন।")};
$("login").onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});error?msg(error.message,true):msg("লগইন সফল!")};
$("logout").onclick=async()=>{let {error}=await db.auth.signOut();if(error)msg(error.message,true)};
db.auth.onAuthStateChange((_e,s)=>authUI(s?.user||null));
async function loadPosts(){$("postsTab").classList.remove("secondary");$("productsTab").classList.add("secondary");$("feed").innerHTML="<h2>সাম্প্রতিক পোস্ট</h2><p class='muted'>লোড হচ্ছে...</p>";let {data,error}=await db.from("posts").select("*").order("created_at",{ascending:false}).limit(50);if(error){$("feed").innerHTML="<h2>সাম্প্রতিক পোস্ট</h2><p>"+esc(error.message)+"</p>";return}$("feed").innerHTML="<h2>সাম্প্রতিক পোস্ট</h2>"+(data.length?data.map(p=>`<article class="post"><div class="meta">${esc(p.created_at||"")}</div><p>${esc(p.content||"")}</p>${url(p.image_url)?`<img class="photo" src="${url(p.image_url)}" alt="পোস্টের ছবি">`:""}<button class="secondary" data-like="${esc(p.id)}">❤️ লাইক</button></article>`).join(""):"<p class='muted'>এখনো কোনো পোস্ট নেই।</p>");$("feed").querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>like(b.dataset.like))}
async function like(id){if(!user)return msg("লাইক দিতে আগে লগইন করুন।",true);let {error}=await db.from("likes").insert({post_id:id,user_id:user.id});error?msg("লাইক দেওয়া যায়নি: "+error.message,true):msg("লাইক দেওয়া হয়েছে!")}
$("publish").onclick=async()=>{if(!user)return msg("পোস্ট করতে আগে লগইন করুন।",true);let content=$("content").value.trim(),image_url=url($("postImage").value.trim())||null;if(!content&&!image_url)return msg("লেখা বা ছবির URL দিন।",true);let {error}=await db.from("posts").insert({user_id:user.id,content,image_url});if(error)return msg(error.message,true);$("content").value="";$("postImage").value="";msg("পোস্ট প্রকাশ হয়েছে!");loadPosts()};
async function loadProducts(){$("productsTab").classList.remove("secondary");$("postsTab").classList.add("secondary");let {data,error}=await db.from("products").select("*").order("created_at",{ascending:false}).limit(100);if(error){$("feed").innerHTML="<h2>পণ্য</h2><p>"+esc(error.message)+"</p>";return}$("feed").innerHTML="<h2>পণ্য</h2>"+(data.length?data.map(p=>`<article class="product">${url(p.image_url)?`<img class="photo" src="${url(p.image_url)}" alt="${esc(p.name)}">`:""}<h3>${esc(p.name)}</h3><p>${esc(p.description||"")}</p><div class="price">৳ ${esc(p.price??"দাম জানতে যোগাযোগ করুন")}</div></article>`).join(""):"<p class='muted'>এখনো কোনো পণ্য নেই।</p>")}
$("postsTab").onclick=loadPosts;$("productsTab").onclick=loadProducts;
$("addProduct").onclick=async()=>{if(!user)return msg("পণ্য যোগ করতে আগে লগইন করুন।",true);let name=$("pname").value.trim(),description=$("desc").value.trim(),price=$("price").value,image_url=url($("pimage").value.trim())||null;if(!name)return msg("পণ্যের নাম লিখুন।",true);let {error}=await db.from("products").insert({user_id:user.id,name,description,price:price===""?null:Number(price),image_url});if(error)return msg(error.message,true);["pname","desc","price","pimage"].forEach(id=>$(id).value="");msg("পণ্য যোগ হয়েছে!");loadProducts()};
(async()=>{let {data}=await db.auth.getSession();authUI(data.session?.user||null);loadPosts()})();
</script></body></html>
